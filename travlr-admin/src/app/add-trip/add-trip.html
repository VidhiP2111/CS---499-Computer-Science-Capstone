<div class="container">
  <div class="row">
    <div class="col-12">
      <h1>Add Trip</h1>
    </div>
  </div>
  <div class="row">
    <div class="col-md-6">
      <form [formGroup]="addForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Trip Name</label>
          <input type="text" class="form-control" formControlName="name">
        </div>
        <div class="mb-3">
          <label class="form-label">Length</label>
          <input type="text" class="form-control" formControlName="length">
        </div>
        <div class="mb-3">
          <label class="form-label">Start</label>
          <input type="text" class="form-control" formControlName="start">
        </div>
        <div class="mb-3">
          <label class="form-label">Resort</label>
          <input type="text" class="form-control" formControlName="resort">
        </div>
        <div class="mb-3">
          <label class="form-label">Price Per Person</label>
          <input type="text" class="form-control" formControlName="perPerson">
        </div>
        <div class="mb-3">
          <label class="form-label">Image URL</label>
          <input type="text" class="form-control" formControlName="image">
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" formControlName="description" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Trip</button>
        <a routerLink="/" class="btn btn-secondary ms-2">Cancel</a>
      </form>
    </div>
  </div>
</div>
